name: Publish APK assets
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Restore and verify prepared APK
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/git/blobs/d79630b29b455101498e770ac4a2f5a672117d2b" --jq .content | base64 --decode > Vibra-5.3.3-debug-universal.apk
          printf '%s  %s\n' '76b67c54b5b6b7cbba5fa57908742ae11e6ea68b4a5f73097fc718d809c01ca0' 'Vibra-5.3.3-debug-universal.apk' > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Upload release assets
        shell: bash
        run: |
          set -euo pipefail
          gh release upload v5.3.3-debug Vibra-5.3.3-debug-universal.apk SHA256SUMS.txt --repo "$GH_REPO"
      - name: Verify asset digests and publish
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess,json,os,hashlib,pathlib
          repo=os.environ['GH_REPO'];release=json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/releases/436402886'],text=True))
          names=['Vibra-5.3.3-debug-universal.apk','SHA256SUMS.txt'];assert set(a['name'] for a in release['assets'])==set(names)
          for asset in release['assets']:
              assert asset['digest']=='sha256:'+hashlib.sha256(pathlib.Path(asset['name']).read_bytes()).hexdigest()
          subprocess.run(['gh','api','--method','PATCH','repos/'+repo+'/releases/436402886','-F','draft=false'],check=True,stdout=subprocess.DEVNULL)
          print('APK and checksum verified; release published.')
          PY
